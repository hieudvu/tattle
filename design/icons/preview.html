<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tattle icon options</title>
<style>
  :root { --bg:#f4f4f6; --card:#fff; --ink:#16161a; --muted:#6b6b76; --line:#e3e3e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1c1c20; --ink:#f2f2f5; --muted:#9a9aa5; --line:#2c2c33; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 16px 64px; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  .lede { color:var(--muted); margin:0 0 28px; max-width:62ch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; }
  .card h2 { font-size:17px; margin:0; display:flex; gap:8px; align-items:baseline; }
  .card h2 span { color:var(--muted); font-weight:400; font-size:13px; }
  .card p { color:var(--muted); margin:4px 0 16px; font-size:13.5px; }
  .sizes { display:flex; align-items:flex-end; gap:14px; margin-bottom:18px; }
  .sizes svg { display:block; }
  .label { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  .bar { display:flex; align-items:center; justify-content:space-between; height:30px; padding:0 12px; border-radius:8px; font-size:12.5px; font-weight:500; }
  .bar.light { background:#e9e9ee; color:#111; }
  .bar.dark { background:#26262b; color:#f2f2f5; }
  .bar .states { display:flex; align-items:center; gap:14px; }
  .bar .st { display:flex; align-items:center; gap:5px; opacity:.9; font-size:11px; font-weight:400; }
  .bar svg { display:block; }
  .zoom { display:flex; gap:16px; margin-top:8px; color:var(--ink); }
  .zoom figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--muted); }
  .zoom svg { background:repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0/12px 12px; border-radius:6px; }
</style>
</head>
<body>
<main>
  <h1>Tattle: icon options</h1>
  <p class="lede">Six directions. Each shows the app icon at Dock sizes, and the menu bar glyph in two states (idle = nothing playing, active = something is making noise) on light and dark bars. Menu bar glyphs are monochrome templates, so the system tints them.</p>
  <div class="grid" id="grid"></div>
</main>

<!-- shared artwork: 24x24 glyphs (currentColor) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b6cf6"/><stop offset="1" stop-color="#a455f0"/></linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb12e"/><stop offset="1" stop-color="#ff4f3a"/></linearGradient>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46c8ff"/><stop offset="1" stop-color="#2a63f0"/></linearGradient>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34364f"/><stop offset="1" stop-color="#7a2fd6"/></linearGradient>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12503b"/><stop offset="1" stop-color="#17c48f"/></linearGradient>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fa0"/><stop offset="1" stop-color="#e02f45"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>

    <mask id="k1"><rect width="24" height="24" fill="#fff"/><g stroke="#000" stroke-width="1.7" stroke-linecap="round"><path d="M8 9v2M10.7 7v6M13.3 8.2v3.6M16 9.2v1.6"/></g></mask>
    <mask id="k2"><rect width="24" height="24" fill="#fff"/><circle cx="11" cy="15" r="2.2" fill="#000"/></mask>
    <mask id="k3"><rect width="24" height="24" fill="#fff"/><circle cx="12.6" cy="12" r="1.2" fill="#000"/></mask>
    <mask id="k4"><rect width="24" height="24" fill="#000"/><path fill="#fff" d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="5" fill="#000"/><path stroke="#fff" stroke-width="1.5" stroke-linecap="round" d="M10 11v2M12 9.7v4.6M14 10.7v2.6"/></mask>

    <!-- 1 Bubble -->
    <symbol id="g1a" viewBox="0 0 24 24"><path mask="url(#k1)" fill="currentColor" d="M6 3.5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5L7 21v-4.5H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/></symbol>
    <symbol id="g1i" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M6 3.5h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5L7 21v-4.5H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3z"/><path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M8.5 10h7"/></symbol>
    <!-- 2 Whistle -->
    <symbol id="g2a" viewBox="0 0 24 24"><g mask="url(#k2)" fill="currentColor"><circle cx="11" cy="15" r="6.2"/><rect x="11" y="9" width="11" height="4.6" rx="1.3"/></g><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M8.2 7.2L7.6 5.6M4.6 9.7L3.3 8.6M2.8 13.6L1.1 13.3"/></symbol>
    <symbol id="g2i" viewBox="0 0 24 24"><g mask="url(#k2)" fill="currentColor" opacity=".5"><circle cx="11" cy="15" r="6.2"/><rect x="11" y="9" width="11" height="4.6" rx="1.3"/></g></symbol>
    <!-- 3 Bird -->
    <symbol id="g3a" viewBox="0 0 24 24"><g mask="url(#k3)" fill="currentColor"><circle cx="10" cy="13.5" r="7"/><path d="M16.2 11.6L21.5 13.8L16.2 15.8z"/><path d="M8.2 7.6L7 3.8L11.2 6.4z"/></g><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M15.5 5.5a4.5 4.5 0 0 1 3.2 3.2M16.5 2.2a8 8 0 0 1 5.2 5.2"/></symbol>
    <symbol id="g3i" viewBox="0 0 24 24"><g mask="url(#k3)" fill="currentColor" opacity=".5"><circle cx="10" cy="13.5" r="7"/><path d="M16.2 11.6L21.5 13.8L16.2 15.8z"/><path d="M8.2 7.6L7 3.8L11.2 6.4z"/></g></symbol>
    <!-- 4 Eye -->
    <symbol id="g4a" viewBox="0 0 24 24"><rect width="24" height="24" fill="currentColor" mask="url(#k4)"/></symbol>
    <symbol id="g4i" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/></symbol>
    <!-- 5 Sonar -->
    <symbol id="g5a" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="9"/></g><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="17.6" cy="6.4" r="2.5" fill="currentColor"/></symbol>
    <symbol id="g5i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/></symbol>
    <!-- 6 Speaker -->
    <symbol id="g6a" viewBox="0 0 24 24"><path fill="currentColor" d="M3.5 9.5h3.7L12.5 5v14l-5.3-4.5H3.5z"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M15.5 9.3a3.7 3.7 0 0 1 0 5.4M18 6.8a7.2 7.2 0 0 1 0 10.4"/></symbol>
    <symbol id="g6i" viewBox="0 0 24 24"><path fill="currentColor" opacity=".5" d="M3.5 9.5h3.7L12.5 5v14l-5.3-4.5H3.5z"/></symbol>
  </defs>
</svg>

<script>
const options = [
  { n: 1, name: "Bubble",  blurb: "A speech bubble whose words are a waveform. “Tattle” = telling on someone." },
  { n: 2, name: "Whistle", blurb: "Blowing the whistle on the noisy app. Sound rays only appear when active." },
  { n: 3, name: "Bird",    blurb: "“A little bird told me.” Beak closed when quiet, singing when not." },
  { n: 4, name: "Eye",     blurb: "Watching for who is making noise. The pupil turns into a waveform." },
  { n: 5, name: "Sonar",   blurb: "Locating the source. A blip appears on the radar when something plays." },
  { n: 6, name: "Speaker", blurb: "The plain, obvious one. Most legible, least personality." },
];

const glyph = (n, state, px) =>
  `<svg width="${px}" height="${px}" viewBox="0 0 24 24" aria-label="${state}"><use href="#g${n}${state === 'active' ? 'a' : 'i'}"/></svg>`;

const appIcon = (n, px) =>
  `<svg width="${px}" height="${px}" viewBox="0 0 100 100" aria-label="app icon ${n}">
     <rect width="100" height="100" rx="22.4" fill="url(#bg${n})"/>
     <rect width="100" height="100" rx="22.4" fill="url(#shine)"/>
     <use href="#g${n}a" x="20" y="20" width="60" height="60" color="#fff"/>
   </svg>`;

const bar = (n, theme) => `
  <div class="bar ${theme}">
    <span>Sat 11 Oct&nbsp;&nbsp;14:02</span>
    <span class="states">
      <span class="st">${glyph(n, 'idle', 18)}idle</span>
      <span class="st">${glyph(n, 'active', 18)}active</span>
    </span>
  </div>`;

document.getElementById('grid').innerHTML = options.map(o => `
  <section class="card">
    <h2>${o.n}. ${o.name}</h2>
    <p>${o.blurb}</p>
    <div class="sizes">${appIcon(o.n,128)}${appIcon(o.n,64)}${appIcon(o.n,32)}${appIcon(o.n,16)}</div>
    <div class="label">Menu bar · 18 pt</div>
    ${bar(o.n,'light')}
    <div style="height:6px"></div>
    ${bar(o.n,'dark')}
    <div class="label">Glyph, enlarged</div>
    <div class="zoom">
      <figure>${glyph(o.n,'idle',72)}idle</figure>
      <figure>${glyph(o.n,'active',72)}active</figure>
    </div>
  </section>`).join('');
</script>
</body>
</html>
